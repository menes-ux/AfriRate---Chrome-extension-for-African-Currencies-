<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icon128.png">
    <!-- Using Inter font (as it's often the default), but keeping your links for Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet"><link rel="stylesheet" href="popup.css">

    <title>AfroRate</title>
</head>

<body>
    <main>
        <h1>AfroRate</h1>
        <p class="tagline">Instant Rates. Inside your browser</p>
        <div class="converter-section">
            <div class="converter">
                <label for="amount"><strong>From</strong></label>
                <input type="number" id="amount" placeholder="Enter amount">
                <select name="currency" id="from-currency">
                    <option value="USD" selected>USD</option>
                    <option value="AOA">AOA – Angolan Kwanza</option>
                    <option value="BIF">BIF – Burundian Franc</option>
                    <option value="BWP">BWP – Botswana Pula</option>
                    <option value="CDF">CDF – Congolese Franc</option>
                    <option value="CVE">CVE – Cape Verdean Escudo</option>
                    <option value="DJF">DJF – Djiboutian Franc</option>
                    <option value="DZD">DZD – Algerian Dinar</option>
                    <option value="EGP">EGP – Egyptian Pound</option>
                    <option value="ERN">ERN – Eritrean Nakfa</option>
                    <option value="ETB">ETB – Ethiopian Birr</option>
                    <option value="GHS">GHS – Ghanaian Cedi</option>
                    <option value="GMD">GMD – Gambian Dalasi</option>
                    <option value="GNF">GNF – Guinean Franc</option>
                    <option value="KES">KES – Kenyan Shilling</option>
                    <option value="KMF">KMF – Comorian Franc</option>
                    <option value="LRD">LRD – Liberian Dollar</option>
                    <option value="LSL">LSL – Lesotho Loti</option>
                    <option value="LYD">LYD – Libyan Dinar</option>
                    <option value="MAD">MAD – Moroccan Dirham</option>
                    <option value="MGA">MGA – Malagasy Ariary</option>
                    <option value="MRU">MRU – Mauritanian Ouguiya</option>
                    <option value="MUR">MUR – Mauritian Rupee</option>
                    <option value="MWK">MWK – Malawian Kwacha</option>
                    <option value="MZN">MZN – Mozambican Metical</option>
                    <option value="NAD">NAD – Namibian Dollar</option>
                    <option value="NGN">NGN – Nigerian Naira</option>
                    <option value="RWF">RWF – Rwandan Franc</option>
                    <option value="SCR">SCR – Seychellois Rupee</option>
                    <option value="SDG">SDG – Sudanese Pound</option>
                    <option value="SLE">SLE – Sierra Leonean Leone (new)</option>
                    <option value="SLL">SLL – Sierra Leonean Leone (old)</option>
                    <option value="SOS">SOS – Somali Shilling</option>
                    <option value="SSP">SSP – South Sudanese Pound</option>
                    <option value="STN">STN – São Tomé and Príncipe Dobra</option>
                    <option value="SZL">SZL – Eswatini Lilangeni</option>
                    <option value="TND">TND – Tunisian Dinar</option>
                    <option value="TZS">TZS – Tanzanian Shilling</option>
                    <option value="UGX">UGX – Ugandan Shilling</option>
                    <option value="XAF">XAF – Central African CFA Franc</option>
                    <option value="XOF">XOF – West African CFA Franc</option>
                    <option value="ZAR">ZAR – South African Rand</option>
                    <option value="ZMW">ZMW – Zambian Kwacha</option>
                    <option value="ZWL">ZWL – Zimbabwean Dollar</option>
                </select>
            </div>

            <div class="swap-container">
                <button id="swap-button" title="Swap Currencies">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                    </button>
            </div>


            <div class="converter">
                <label for="to-currency"><strong>To</strong></label>
                <select name="currency" id="to-currency">
                    <option value="USD">USD</option>
                    <option value="AOA">AOA – Angolan Kwanza</option>
                    <option value="BIF">BIF – Burundian Franc</option>
                    <option value="BWP">BWP – Botswana Pula</option>
                    <option value="CDF">CDF – Congolese Franc</option>
                    <option value="CVE">CVE – Cape Verdean Escudo</option>
                    <option value="DJF">DJF – Djiboutian Franc</option>
                    <option value="DZD">DZD – Algerian Dinar</option>
                    <option value="EGP">EGP – Egyptian Pound</option>
                    <option value="ERN">ERN – Eritrean Nakfa</option>
                    <option value="ETB">ETB – Ethiopian Birr</option>
                    <option value="GHS">GHS – Ghanaian Cedi</option>
                    <option value="GMD">GMD – Gambian Dalasi</option>
                    <option value="GNF">GNF – Guinean Franc</option>
                    <option value="KES">KES – Kenyan Shilling</option>
                    <option value="KMF">KMF – Comorian Franc</option>
                    <option value="LRD">LRD – Liberian Dollar</option>
                    <option value="LSL">LSL – Lesotho Loti</option>
                    <option value="LYD">LYD – Libyan Dinar</option>
                    <option value="MAD">MAD – Moroccan Dirham</option>
                    <option value="MGA">MGA – Malagasy Ariary</option>
                    <option value="MRU">MRU – Mauritanian Ouguiya</option>
                    <option value="MUR">MUR – Mauritian Rupee</option>
                    <option value="MWK">MWK – Malawian Kwacha</option>
                    <option value="MZN">MZN – Mozambican Metical</option>
                    <option value="NAD">NAD – Namibian Dollar</option>
                    <option value="NGN">NGN – Nigerian Naira</option>
                    <option value="RWF" selected>RWF – Rwandan Franc</option>
                    <option value="SCR">SCR – Seychellois Rupee</option>
                    <option value="SDG">SDG – Sudanese Pound</option>
                    <option value="SLE">SLE – Sierra Leonean Leone (new)</option>
                    <option value="SLL">SLL – Sierra Leonean Leone (old)</option>
                    <option value="SOS">SOS – Somali Shilling</option>
                    <option value="SSP">SSP – South Sudanese Pound</option>
                    <option value="STN">STN – São Tomé and Príncipe Dobra</option>
                    <option value="SZL">SZL – Eswatini Lilangeni</option>
                    <option value="TND">TND – Tunisian Dinar</option>
                    <option value="TZS">TZS – Tanzanian Shilling</option>
                    <option value="UGX">UGX – Ugandan Shilling</option>
                    <option value="XAF">XAF – Central African CFA Franc</option>
                    <option value="XOF">XOF – West African CFA Franc</option>
                    <option value="ZAR">ZAR – South African Rand</option>
                    <option value="ZMW">ZMW – Zambian Kwacha</option>
                    <option value="ZWL">ZWL – Zimbabwean Dollar</option>
                </select>
                <input type="number" id="result" placeholder="Result" disabled>
            </div>

            <div class="converter-button-wrapper">
               
                <button id="convert-button" disabled>Convert</button> 
            </div>
        </div>
        <p id="status-text" class="status"></p>
        <div class="footer">
            <p>Works offline, anywhere!</p>
            <p>By <a target="_blank" href="https://github.com/menes-ux">Menes Adisso</a></p>

        </div>
    </main>

    <!-- Script tag is best placed at the end of the body -->
    <script src="script.js"></script>
</body>
</html>
